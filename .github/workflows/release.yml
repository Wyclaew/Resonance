name: Release

# Bir sürüm etiketi (ör. v0.1.0) push edilince çalışır.
# macOS .dmg ve Windows .exe üretip taslak bir GitHub Release'e ekler.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            triple: aarch64-apple-darwin
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Bağımlılıkları kur
        run: npm install

      # --- yt-dlp + ffmpeg sidecar ikilileri (kurulum gerekmesin diye uygulamaya gömülür) ---
      - name: Sidecar indir (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos \
            -o src-tauri/binaries/yt-dlp-${{ matrix.triple }}
          curl -L https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64 \
            -o src-tauri/binaries/ffmpeg-${{ matrix.triple }}
          chmod +x src-tauri/binaries/*

      - name: Sidecar indir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe \
            -o src-tauri/binaries/yt-dlp-${{ matrix.triple }}.exe
          curl -L https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64 \
            -o src-tauri/binaries/ffmpeg-${{ matrix.triple }}.exe

      # ⭐ APPLE İMZASI (v1.9.3). Sertifika gizli anahtarı VARSA gerçek
      # "Developer ID Application" kimliğiyle imzalanır ve notarize edilir →
      # kullanıcı "sağ tık → Aç" yapmak zorunda kalmaz. Sertifika YOKSA hiçbir
      # şey değişmez, eskisi gibi ad-hoc imzalanır (tauri.conf'taki "-").
      #
      # ⚠️ Kimliği env'e bırakmıyoruz, tauri.conf'a YAZIYORUZ: config'te "-"
      # dururken env'in kazanıp kazanmadığı sürüme bağlı bir ayrıntı ve sessizce
      # ad-hoc imzalı sürüm yayınlamak istemiyoruz.
      - name: macOS imza kimliğini yaz (sertifika varsa)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Apple sertifikası yok → ad-hoc imza (mevcut davranış)"
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          p = "src-tauri/tauri.conf.json"
          d = json.load(open(p))
          mac = d["bundle"].setdefault("macOS", {})
          mac["signingIdentity"] = os.environ["APPLE_SIGNING_IDENTITY"]
          # Hardened runtime altında yt-dlp/ffmpeg çalışabilsin diye.
          mac["entitlements"] = "entitlements.plist"
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          print("imza kimliği yazıldı:", mac["signingIdentity"])
          PY

      - name: Derle & sürüm oluştur
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⭐ OTOMATİK GÜNCELLEME İMZASI (v1.9.2). Bu anahtar olmadan
          # `latest.json` + `.sig` üretilmez ve istemci güncellemeyi REDDEDER
          # (build de hata verir, çünkü createUpdaterArtifacts açık).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple: sertifikayı geçici keychain'e kurar (tauri-action yapar).
          # Boşsa bu adımlar atlanır.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarizasyon (Apple sunucusuna gönderip damgalama). Üçü de doluysa
          # yapılır; biri boşsa yalnız imza kalır.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # macOS'ta hedefi AÇIKÇA ver: sidecar'lar aarch64 adıyla indiriliyor,
          # runner mimarisi değişirse eşleşmeyip build kırılırdı.
          args: ${{ matrix.platform == 'macos-latest' && '--target aarch64-apple-darwin' || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: "Resonance ${{ github.ref_name }}"
          releaseBody: |
            Otomatik sürüm. macOS `.dmg` ve Windows `.exe` ekte.

            > macOS: sürüm Apple sertifikasıyla imzalıysa doğrudan çift tıkla
            > açılır. İmzasız (ad-hoc) üretilmişse ilk açılışta **sağ tık → Aç →
            > Aç** gerekir (bir kez).
            > Windows: imzasızken "bilinmeyen yayıncı" uyarısında "Yine de çalıştır".

            > Uygulama v1.9.2'den itibaren kendini günceller; bu sürümü bir kez
            > elle kurmak yeterli.
          # ⚠️ TASLAK OLAMAZ: güncelleyici `releases/latest/download/latest.json`
          # adresine bakar ve taslak sürümler orada GÖRÜNMEZ.
          releaseDraft: false
          prerelease: false
